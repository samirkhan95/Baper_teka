name: baper_teka
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  path: ^1.8.3
  intl: ^0.18.1
  google_fonts: ^6.1.0
  fl_chart: ^0.63.0
  provider: ^6.0.5
  uuid: ^4.1.0
  pdf: ^3.10.7
  printing: ^5.11.1
  path_provider: ^2.1.1
  file_picker: ^8.0.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "asset/tekaapp.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - asset/tekaapp.png
